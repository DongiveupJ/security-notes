title: Junseo’s Security Notes
description: 김준서의 보안·개발 학습 노트. 질문하고, 직접 확인하고, 다시 설명할 수 있을 때까지 기록합니다.
url: https://dongiveupj.github.io
baseurl: /security-notes
lang: ko
timezone: Asia/Seoul
markdown: kramdown
highlighter: rouge
permalink: /:year/:month/:day/:title/
author: 김준서
github_username: DongiveupJ
category_index:
  - slug: development
    name: 개발
    description: 직접 만들면서 만난 문제와 해결 과정을 남깁니다.
  - slug: ctf-wargame
    name: CTF/Wargame
    description: 허가된 실습 환경에서 문제의 원리와 풀이를 정리합니다.
  - slug: bug-bounty
    name: Bug Bounty
    description: 허용 범위와 책임 있는 제보 원칙을 바탕으로 공부합니다.
  - slug: technical-writing
    name: 블로그/기술문서
    description: 배운 내용을 다시 설명하고, 참고한 문서를 연결합니다.
  - slug: papers-conferences
    name: 논문/컨퍼런스
    description: 읽고 들은 내용에서 핵심 질문과 배운 점을 정리합니다.
  - slug: competitions-certifications
    name: 공모전/자격증
    description: 준비 과정과 회고를 기록합니다. 계획과 결과를 구분합니다.
exclude:
  - README.md
  - docs
  - tests
  - task_plan.md
  - findings.md
  - progress.md
  - Gemfile
  - Gemfile.lock
