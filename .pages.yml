media:
  input: assets/images
  output: /security-notes/assets/images

content:
  - name: posts
    label: 글
    type: collection
    path: _posts
    filename:
      template: "{year}-{month}-{day}-{primary}.md"
      field: create
    fields:
      - name: layout
        type: string
        default: post
        hidden: true
      - name: title
        label: 제목
        type: string
        required: true
      - name: date
        label: 날짜
        type: date
        options:
          time: true
          format: "yyyy-MM-dd HH:mm:ss '+0900'"
      - name: category
        label: 카테고리
        type: select
        required: true
        options:
          values:
            - name: development
              label: 개발
            - name: ctf-wargame
              label: CTF/Wargame
            - name: bug-bounty
              label: Bug Bounty
            - name: technical-writing
              label: 블로그/기술문서
            - name: papers-conferences
              label: 논문/컨퍼런스
            - name: competitions-certifications
              label: 공모전/자격증
      - name: description
        label: 목록에 보일 소개
        type: text
      - name: body
        label: 본문
        type: rich-text
        options:
          format: markdown
